name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # A PR opened with the default GITHUB_TOKEN does not trigger other
          # workflows, so the release PR arrives without the `test` check that
          # main requires. Two ways to deal with that, neither blocking:
          #   - set RELEASE_PLEASE_TOKEN to a fine-grained PAT (Contents and
          #     Pull requests, read/write) and checks run by themselves, or
          #   - close and reopen the release PR once; that is a human action,
          #     so it does trigger the check.
          # The fallback below keeps this working with no secret configured.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
